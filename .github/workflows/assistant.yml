name: Portfolio assistant
on:
  pull_request:
    branches: [develop, main]
jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements.txt pytest httpx uvicorn
      - run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools
      - run: pnpm run lint && pnpm run test && pnpm run build
      - run: git diff --exit-code -- server/assistant_catalog.json
      - run: python -m pytest -q tests
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm exec playwright test --config playwright.assistant.config.ts
      - run: pnpm exec playwright test --config playwright.posthog.config.ts
